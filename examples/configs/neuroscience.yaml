# vault_config.yaml — Neuroscience Research Example
# This demonstrates using the framework for a different domain.

vault_name: "Neuroscience KB"
language: "en"

domains:
  Neurobiology:
    description: "Cellular and molecular neuroscience"
    keywords:
      - "neurobiology"
      - "neuroscience"
      - "synaptic plasticity"
      - "neuronal circuits"
      - "electrophysiology"
      - "neurotransmitter"
    is_default: true
  CognitiveScience:
    description: "Cognition, memory, attention"
    keywords:
      - "cognitive science"
      - "memory"
      - "attention"
      - "perception"
      - "decision making"
      - "executive function"
  Neuroimaging:
    description: "Brain imaging methods and analysis"
    keywords:
      - "fMRI"
      - "EEG"
      - "MEG"
      - "PET"
      - "neuroimaging"
      - "brain mapping"
  Computational:
    description: "Computational neuroscience and modeling"
    keywords:
      - "computational neuroscience"
      - "neural networks"
      - "brain simulation"
      - "connectomics"
  Clinical:
    description: "Neurological disorders and treatments"
    keywords:
      - "neurological disorders"
      - "neurodegeneration"
      - "Alzheimer"
      - "Parkinson"
      - "epilepsy"

default_domain: "Neurobiology"

section_markers:
  - "# Background"
  - "# Methods"
  - "# Results"
  - "# Discussion"
  - "# Significance"
figures_section: "## Figures"

filtering:
  generic_blocklist:
    - "data analysis"
    - "statistical analysis"
    - "experimental design"
    - "data collection"
    - "methodology"
    - "results interpretation"
  boost_patterns:
    - "synap"
    - "neuron"
    - "cortex"
    - "hippocamp"
    - "dopamin"
    - "serotonin"
    - "GABA"
    - "glutamate"
    - "amygdala"
    - "prefrontal"
    - "plasticity"
    - "potentiation"
  alias_blocklist:
    - "model"
    - "system"
    - "function"
    - "process"
    - "analysis"
    - "data"
    - "method"
    - "result"
    - "response"
    - "activity"
  stem_blocklist: ["id", "os", "io"]
  min_alias_length: 12

link_injection:
  scan_dirs:
    - "OV-Papers/PDF-md"

enrichment:
  style_reference: null
  target_level: "basic"
  batch_size: 10

capture:
  mode: "inline+debrief"

modules:
  zotero: false
  paper_pipeline: false

learning:
  goals:
    - "Understand synaptic mechanisms of learning and memory"
    - "Master fMRI data analysis pipelines"
  current_focus: "Synaptic plasticity"
  experience_level: "intermediate"

user_profile:
  research_areas:
    - "Cognitive Neuroscience"
    - "Neuroimaging"
  knowledge_gaps:
    - "Molecular neurobiology"
    - "Computational modeling"

preferences:
  note_language: "en"
  moc_style: "narrative"
  link_format: "citekey"
  auto_rescan: true
