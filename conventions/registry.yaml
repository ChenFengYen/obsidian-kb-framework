# Convention rule_id registry — single source of truth for the KB-* namespace.
#
# Every Convention note, in this repository or in any vault generated from it,
# must carry a rule_id listed here. `validate_conventions.py --registry` enforces
# that: an unlisted id fails, and two notes claiming one id fail.
#
# status:
#   shipped  - the Convention note lives in this repository, under `pack`.
#   reserved - the id is taken by an upstream vault; the note has not been made
#              portable yet. Reserved ids are recorded so a new Convention never
#              silently reuses a number that already means something elsewhere.
#
# Adding a rule: append to `rules`, never renumber an existing entry. Ids are
# permanent even after a note is superseded — see KB-HISTORY-001.

version: 1

# Prefixes owned by downstream vaults. Their contents are domain-specific and
# deliberately absent here; this repository only reserves the namespace so
# generic KB-* numbering can never collide with a domain rule.
reserved_prefixes:
  - prefix: PHENO-
    owner: downstream vault (plant phenotyping)
  - prefix: ML-
    owner: downstream vault (machine learning)

